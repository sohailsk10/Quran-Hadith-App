name: flutter_hadith_app
description: "A comprehensive Quran and Hadith application with multiple translations, recitations, and Hadith collections."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  http: ^1.1.0

  # Local Storage
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Network & API
  dio: ^5.5.0+1
  connectivity_plus: ^6.0.3

  # Audio
  just_audio: ^0.9.36
  audio_session: ^0.1.19

  # Utilities
  intl: ^0.20.2
  path_provider: ^2.1.3
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  quran: ^1.0.0

  # UI Enhancements
  shimmer: ^3.0.0

  # Settings & Theming
  google_fonts: ^6.2.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/data/
    - assets/audio/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
